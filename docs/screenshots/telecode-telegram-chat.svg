<svg xmlns="http://www.w3.org/2000/svg" width="940" height="920" viewBox="0 0 940 920" role="img" aria-labelledby="tgTitle tgDesc">
  <title id="tgTitle">TeleCode · Telegram Owner Chat Interface</title>
  <desc id="tgDesc">Pixel-perfect Telegram dark mode interface mockup showing Google Antigravity agent switching, inline keyboard buttons, real-time tool execution, and session management controls.</desc>

  <defs>
    <!-- Window Drop Shadow -->
    <filter id="winShadow" x="-3%" y="-2%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    
    <!-- Telegram Background Doodle Pattern -->
    <pattern id="tgDoodle" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M20 20l8 4-8 4v-3l5-1-5-1z" fill="#ffffff" fill-opacity="0.025"/>
      <circle cx="80" cy="30" r="3" fill="#ffffff" fill-opacity="0.02"/>
      <path d="M50 75c-3 0-5 2-5 5s2 5 5 5 5-2 5-5-2-5-5-5zm0 8c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z" fill="#ffffff" fill-opacity="0.025"/>
      <path d="M95 85h12v3H95z" fill="#ffffff" fill-opacity="0.02"/>
      <path d="M25 90l3-6 3 6z" fill="#ffffff" fill-opacity="0.025"/>
      <path d="M70 105c2-2 5-2 7 0l2 2-2 2c-2 2-5 2-7 0l-2-2z" fill="#ffffff" fill-opacity="0.02"/>
      <circle cx="35" cy="55" r="1.5" fill="#ffffff" fill-opacity="0.03"/>
      <circle cx="105" cy="45" r="2" fill="#ffffff" fill-opacity="0.02"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2c38"/>
      <stop offset="100%" stop-color="#17212b"/>
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b5278"/>
      <stop offset="100%" stop-color="#224263"/>
    </linearGradient>

    <linearGradient id="antigravityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30b3ef"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Telegram App Window Frame -->
  <rect x="15" y="15" width="910" height="890" rx="20" fill="#0e1621" filter="url(#winShadow)"/>
  <rect x="15" y="15" width="910" height="890" rx="20" fill="url(#tgDoodle)"/>
  <rect x="15" y="15" width="910" height="890" rx="20" fill="none" stroke="#232e3c" stroke-width="1.5"/>

  <!-- ==================== TOPBAR HEADER ==================== -->
  <rect x="15" y="15" width="910" height="68" rx="20" fill="url(#headerGrad)"/>
  <rect x="15" y="63" width="910" height="20" fill="#17212b"/>
  <line x1="15" y1="83" x2="925" y2="83" stroke="#101820" stroke-width="1.5"/>

  <!-- Window Control Dots (Desktop macOS / Linux style) -->
  <circle cx="42" cy="49" r="6" fill="#ec6a5e"/>
  <circle cx="62" cy="49" r="6" fill="#f4bf4f"/>
  <circle cx="82" cy="49" r="6" fill="#61c554"/>

  <!-- Bot Avatar -->
  <g transform="translate(112, 29)">
    <circle cx="20" cy="20" r="20" fill="url(#avatarGrad)"/>
    <!-- Paper Plane Icon -->
    <path d="M12 20.5l16-6.5-6.5 16-3-6-6.5-3.5zm7 2.5l-2.2 4.5.7-4 7-7.5-5.5 7z" fill="#ffffff"/>
    <!-- Online status ring -->
    <circle cx="34" cy="34" r="5" fill="#17212b"/>
    <circle cx="34" cy="34" r="3.5" fill="#4faeec"/>
  </g>

  <!-- Bot Title & Status -->
  <text x="164" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="-0.01em">TeleCode</text>
  <!-- BOT Badge -->
  <rect x="238" y="32" width="32" height="15" rx="3.5" fill="#2b5278"/>
  <text x="254" y="43" fill="#68b4e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">BOT</text>
  <text x="164" y="62" fill="#708499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">bot • online • authorized owner chat</text>

  <!-- Header Right Action Buttons -->
  <g transform="translate(815, 36)" stroke="#708499" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Search -->
    <circle cx="12" cy="12" r="6"/>
    <line x1="16.5" y1="16.5" x2="22" y2="22"/>
    <!-- More (3 dots) -->
    <circle cx="48" cy="8" r="1.5" fill="#708499" stroke="none"/>
    <circle cx="48" cy="13" r="1.5" fill="#708499" stroke="none"/>
    <circle cx="48" cy="18" r="1.5" fill="#708499" stroke="none"/>
  </g>

  <!-- ==================== CHAT BODY ==================== -->

  <!-- Date Pill -->
  <rect x="430" y="98" width="80" height="24" rx="12" fill="#17212b" fill-opacity="0.85"/>
  <text x="470" y="114" fill="#708499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">TODAY</text>

  <!-- 1. USER MESSAGE: /cli -->
  <g transform="translate(735, 134)">
    <rect width="155" height="40" rx="14" fill="url(#userBubble)"/>
    <path d="M155 14c0-4 3-8 5-10-3 3-5 7-5 10z" fill="#2b5278"/>
    <text x="16" y="25" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="600">/cli</text>
    <text x="100" y="28" fill="#7ea3c4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">22:04</text>
    <!-- Double checkmark -->
    <path d="M132 24l3 3 6-6m-4 3l3 3 6-6" stroke="#4faeec" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 2. BOT MESSAGE: Active Agent Switcher + Inline Buttons -->
  <g transform="translate(45, 186)">
    <!-- Main Bubble Container -->
    <rect width="670" height="236" rx="16" fill="#182533" stroke="#1f3144" stroke-width="1"/>
    
    <!-- Accent Line -->
    <rect x="18" y="16" width="3.5" height="76" rx="1.5" fill="url(#antigravityGrad)"/>

    <!-- Agent Title -->
    <text x="32" y="32" fill="#30b3ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Google Antigravity</text>
    <rect x="175" y="21" width="56" height="16" rx="3.5" fill="#0d2b3d"/>
    <text x="203" y="32" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>

    <!-- Metadata Details -->
    <g transform="translate(32, 50)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9db0c2">
      <text x="0" y="0"><tspan fill="#5f778d">Binary:    </tspan><tspan fill="#e2e8f0">~/.local/bin/agy</tspan> <tspan fill="#34d399">(v1.5.3 · ready)</tspan></text>
      <text x="0" y="18"><tspan fill="#5f778d">Session:   </tspan><tspan fill="#e2e8f0">c0ff1e99-1bb2-400d-ace4-eb3548cf114c</tspan></text>
      <text x="0" y="36"><tspan fill="#5f778d">Model:     </tspan><tspan fill="#38bdf8" font-weight="600">gemini-4-argon-medium</tspan> <tspan fill="#5f778d">(Google Gemini)</tspan></text>
    </g>

    <!-- Subtitle instruction -->
    <text x="18" y="112" fill="#7992a7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Tap below to switch active agent or open model picker:
    </text>

    <!-- Inline Keyboard: Row 1 -->
    <rect x="18" y="126" width="310" height="38" rx="8" fill="#203449" stroke="#30b3ef" stroke-width="1.4"/>
    <circle cx="34" cy="145" r="4" fill="#30b3ef"/>
    <text x="46" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">✓ Google Antigravity (agy)</text>

    <rect x="342" y="126" width="310" height="38" rx="8" fill="#202b36" stroke="#2a3947" stroke-width="1"/>
    <text x="497" y="150" fill="#d1d9e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" text-anchor="middle">OpenCode</text>

    <!-- Inline Keyboard: Row 2 -->
    <rect x="18" y="172" width="202" height="36" rx="8" fill="#202b36" stroke="#2a3947" stroke-width="1"/>
    <text x="119" y="195" fill="#d1d9e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Claude Code</text>

    <rect x="228" y="172" width="202" height="36" rx="8" fill="#202b36" stroke="#2a3947" stroke-width="1"/>
    <text x="329" y="195" fill="#d1d9e2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Hermes Agent</text>

    <rect x="438" y="172" width="214" height="36" rx="8" fill="#202b36" stroke="#2a3947" stroke-width="1"/>
    <text x="545" y="195" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 Models (/models)</text>

    <!-- Message Timestamp -->
    <text x="635" y="224" fill="#526575" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">22:04</text>
  </g>

  <!-- 3. USER MESSAGE: Run Tests Prompt -->
  <g transform="translate(490, 434)">
    <rect width="400" height="42" rx="14" fill="url(#userBubble)"/>
    <path d="M400 14c0-4 3-8 5-10-3 3-5 7-5 10z" fill="#2b5278"/>
    <text x="16" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Run test suite &amp; verify Antigravity models</text>
    <text x="340" y="28" fill="#7ea3c4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">22:05</text>
    <path d="M372 24l3 3 6-6m-4 3l3 3 6-6" stroke="#4faeec" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. BOT MESSAGE: Execution Streaming & Verification -->
  <g transform="translate(45, 488)">
    <rect width="670" height="196" rx="16" fill="#182533" stroke="#1f3144" stroke-width="1"/>

    <!-- Header status -->
    <circle cx="26" cy="24" r="5" fill="#30b3ef"/>
    <text x="38" y="28" fill="#30b3ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Google Antigravity turn completed</text>
    <text x="270" y="28" fill="#526575" font-family="ui-monospace, monospace" font-size="11">(duration: 1.4s · 0 errors)</text>

    <!-- Embedded Tool Result Box -->
    <g transform="translate(18, 40)">
      <rect width="634" height="80" rx="8" fill="#101923" stroke="#1f3042" stroke-width="1"/>
      <rect x="0" y="0" width="3" height="80" rx="1" fill="#34d399"/>
      
      <text x="16" y="22" fill="#7992a7" font-family="ui-monospace, monospace" font-size="11.5">
        <tspan fill="#34d399" font-weight="700">✓</tspan> Tool: <tspan fill="#e2e8f0" font-weight="600">run_command</tspan>("python3 -m unittest discover -s tests")
      </text>
      <text x="16" y="42" fill="#9db0c2" font-family="ui-monospace, monospace" font-size="11.5">
        Output: <tspan fill="#34d399">Ran 350 tests in 13.9s · OK (skipped=1, failures=0)</tspan>
      </text>
      <text x="16" y="62" fill="#9db0c2" font-family="ui-monospace, monospace" font-size="11.5">
        Model:  <tspan fill="#38bdf8">gemini-4-argon-medium</tspan> passed via <tspan fill="#e2e8f0">--model</tspan> flag
      </text>
    </g>

    <!-- Bot Summary Text -->
    <text x="18" y="142" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" line-height="1.5">
      All 350 tests verified cleanly. Model switcher is active and mapped to Antigravity CLI.
    </text>
    <text x="18" y="162" fill="#9db0c2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Ready for next command or message.
    </text>

    <text x="635" y="184" fill="#526575" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">22:05</text>
  </g>

  <!-- ==================== TELEGRAM BOTTOM REPLY KEYBOARD ==================== -->
  <g transform="translate(15, 696)">
    <!-- Keyboard Container Background -->
    <rect width="910" height="142" fill="#17212b"/>
    <line x1="0" y1="0" x2="910" y2="0" stroke="#101820" stroke-width="1.5"/>

    <!-- Row 1 Buttons (Green: Session Operations) -->
    <g transform="translate(30, 10)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <!-- Current session -->
      <rect width="415" height="36" rx="8" fill="#2e7d32" stroke="#4caf50" stroke-width="1"/>
      <text x="207" y="23" fill="#ffffff">Current session</text>

      <!-- New session -->
      <rect x="435" y="0" width="415" height="36" rx="8" fill="#2e7d32" stroke="#4caf50" stroke-width="1"/>
      <text x="642" y="23" fill="#ffffff">New session</text>
    </g>

    <!-- Row 2 Buttons (Blue: Controls & Navigation) -->
    <g transform="translate(30, 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <!-- Models -->
      <rect width="415" height="36" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="207" y="23" fill="#ffffff">Models</text>

      <!-- Sessions -->
      <rect x="435" y="0" width="415" height="36" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="642" y="23" fill="#ffffff">Sessions</text>
    </g>

    <!-- Row 3 Buttons (Blue Switch CLI + Red Help) -->
    <g transform="translate(30, 94)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <!-- Switch CLI -->
      <rect width="415" height="36" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
      <text x="207" y="23" fill="#ffffff">Switch CLI</text>

      <!-- Help -->
      <rect x="435" y="0" width="415" height="36" rx="8" fill="#c62828" stroke="#ef5350" stroke-width="1"/>
      <text x="642" y="23" fill="#ffffff">Help</text>
    </g>
  </g>

  <!-- ==================== MESSAGE INPUT BAR ==================== -->
  <g transform="translate(15, 838)">
    <rect width="910" height="67" rx="0 0 20 20" fill="#141c24"/>
    <line x1="0" y1="0" x2="910" y2="0" stroke="#101820" stroke-width="1.5"/>

    <!-- Attachment Clip Icon -->
    <g transform="translate(36, 22)" stroke="#708499" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 8v8a4 4 0 0 1-8 0V7a2.5 2.5 0 0 1 5 0v8a1 1 0 0 1-2 0V9"/>
    </g>

    <!-- Input Box -->
    <rect x="74" y="14" width="760" height="40" rx="20" fill="#1a2530" stroke="#223140" stroke-width="1"/>
    <text x="96" y="38" fill="#607385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5">Write a prompt or /command...</text>

    <!-- Send Mic / Plane Button -->
    <circle cx="872" cy="34" r="18" fill="#2b5278"/>
    <path d="M866 34l12-5-5 12-2-4.5-5-2.5z" fill="#ffffff"/>
  </g>
</svg>
