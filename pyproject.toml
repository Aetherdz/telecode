[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecode"
version = "0.1.0"
description = "Owner-only Telegram control surface for local coding-agent CLI sessions"
authors = [{name = "TeleCode contributors"}]
keywords = ["telegram", "opencode", "mcp", "coding-agent", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: User Interfaces",
]
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.scripts]
telecode = "tg_bridge:main"

[project.urls]
Homepage = "https://github.com/Aetherdz/telecode"
Documentation = "https://github.com/Aetherdz/telecode#readme"

[tool.setuptools]
py-modules = ["tg_bridge", "tg_mcp", "get_telegram_id"]
packages = ["adapters"]
